name: Refresh daily dashboard snapshot

on:
  schedule:
    # 22:00 UTC is after the regular US market close in both EST and EDT.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-dashboard-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh providers with retained last-known-good data
        run: npm run snapshot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
          FERC_API_KEY: ${{ secrets.FERC_API_KEY }}
          COMPANY_IR_FEEDS: ${{ secrets.COMPANY_IR_FEEDS }}
      - name: Commit refreshed static snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard-snapshot.json
          git diff --cached --quiet || git commit -m "Refresh post-close dashboard snapshot"
          git push
      - name: Build dashboard
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
