name: Refresh daily dashboard snapshot

on:
  schedule:
    # 22:00 UTC is after the regular US market close in both EST and EDT.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh providers with retained last-known-good data
        run: npm run snapshot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PJM_API_KEY: ${{ secrets.PJM_API_KEY }}
          FERC_API_KEY: ${{ secrets.FERC_API_KEY }}
          COMPANY_IR_FEEDS: ${{ secrets.COMPANY_IR_FEEDS }}
      - name: Commit refreshed static snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard-snapshot.json
          git diff --cached --quiet || git commit -m "Refresh post-close dashboard snapshot"
          git push origin HEAD:main
