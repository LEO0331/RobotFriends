name: Regenerate npm lockfile (temporary)

on:
  push:
    branches:
      - chore/regenerate-lock-ci

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Regenerate lockfile with the same Node major used by CI
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json did not change; refusing to create a no-op fix"
            exit 1
          fi
          git diff --stat -- package-lock.json
      - name: Commit synchronized lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regenerate-lock-temp.yml
          git add package-lock.json .github/workflows/regenerate-lock-temp.yml
          git commit -m "fix(ci): synchronize npm lockfile"
          git push origin HEAD:refs/heads/feat/region-focus-map
