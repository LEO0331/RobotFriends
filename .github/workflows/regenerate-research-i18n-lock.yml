name: Regenerate research i18n lockfile

on:
  push:
    branches:
      - chore/regenerate-research-i18n-lock

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Regenerate lockfile with CI Node/npm
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regenerate-research-i18n-lock.yml
          git add package-lock.json .github/workflows/regenerate-research-i18n-lock.yml
          git commit -m "fix(ci): synchronize lockfile after security update"
          git push origin HEAD:refs/heads/feat/research-lab-i18n
